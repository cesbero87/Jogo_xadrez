<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez AI - JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Xadrez vs AI</h1>
            
            <div class="scoreboard">
                <div class="player-score">
                    <span class="name">Você</span>
                    <span class="score" id="score-white">0</span>
                </div>
                <div class="divider">-</div>
                <div class="player-score">
                    <span class="name">Computador</span>
                    <span class="score" id="score-black">0</span>
                </div>
            </div>

            <div class="status-panel">
                <div class="player-indicator" id="player-indicator">Sua vez (Brancas)</div>
                <div class="status-text" id="status">Jogo iniciado</div>
            </div>
        </div>

        <div class="board-wrapper">
            <div id="chessboard" class="chessboard">
                <!-- Squares will be generated by JS -->
            </div>
        </div>

        <div class="controls">
            <button id="restart-btn" class="btn">Reiniciar Jogo</button>
            <div class="captured-pieces">
                <div id="captured-white"></div>
                <div id="captured-black"></div>
            </div>
        </div>
    </div>

    <!-- Piece Templates (Svgs can be used directly in JS or CSS, but having structure helps) -->
    <script src="script.js"></script>
</body>
</html>
